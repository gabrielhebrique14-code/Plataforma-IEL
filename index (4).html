<style>/* IEL – Instituto de Ensino Liberty · design system */
:root {
  --orange: #F47C20;
  --orange-600: #D9650E;
  --orange-50: #FEF1E6;
  --graphite: #252525;
  --graphite-2: #333333;
  --gray: #707070;
  --gray-2: #A3A3A3;
  --line: #E3E3E3;
  --light: #F2F2F2;
  --white: #FFFFFF;
  --green: #1C8A4A;
  --green-50: #E7F5EC;
  --red: #C62828;
  --red-50: #FDECEC;
  --blue: #1F5FA8;
  --blue-50: #E8F0FA;
  --amber: #A86500;
  --amber-50: #FFF4DE;

  --bg: var(--light);
  --surface: var(--white);
  --text: var(--graphite);
  --muted: #5F5F5F;
  --radius: 14px;
  --radius-sm: 10px;
  --shadow: 0 1px 2px rgba(37, 37, 37, .06), 0 6px 20px -8px rgba(37, 37, 37, .12);
  --display: "Saira", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --wrap: 1180px;
  --sidebar: 256px;
  --bottom-nav: 64px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16.5px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
img, svg { max-width: 100%; display: block; }
a { color: var(--orange-600); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.12; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 4.6vw, 48px); font-weight: 800; }
h2 { font-size: clamp(22px, 3vw, 32px); font-weight: 800; }
h3 { font-size: 19px; font-weight: 700; }
p { margin: 0 0 .8em; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--graphite); color: #fff; padding: 10px 14px; border-radius: 8px; z-index: 100; }
.skip:focus { left: 8px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: 16px; }
@media (min-width: 720px) { .wrap { padding-inline: 24px; } }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.center { text-align: center; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.stack > * + * { margin-top: 16px; }
.grid { display: grid; gap: 16px; }
.grid.cols-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); }
.eyebrow { font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--orange-600); display: inline-flex; align-items: center; gap: 10px; }
.eyebrow::before { content: ""; width: 22px; height: 3px; background: var(--orange); border-radius: 2px; }

/* ---------- botões */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 12px 20px; border-radius: var(--radius-sm); border: 1.5px solid transparent; background: var(--orange); color: #fff; font-family: var(--display); font-weight: 700; font-size: 15.5px; letter-spacing: .03em; text-transform: uppercase; text-decoration: none; cursor: pointer; transition: background .15s, transform .15s, box-shadow .15s; line-height: 1.15; text-align: center; }
.btn:hover { background: var(--orange-600); }
.btn:active { transform: translateY(1px); }
.btn[disabled], .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn.dark { background: var(--graphite); }
.btn.dark:hover { background: #000; }
.btn.ghost { background: transparent; color: var(--graphite); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--graphite); background: var(--white); }
.btn.on-dark { background: transparent; color: #fff; border-color: rgba(255,255,255,.4); }
.btn.on-dark:hover { border-color: #fff; }
.btn.danger { background: var(--red); }
.btn.sm { min-height: 38px; padding: 8px 14px; font-size: 13.5px; }
.btn.block { display: flex; width: 100%; }
.btn svg { width: 18px; height: 18px; flex: none; }
.link-btn { background: none; border: 0; padding: 0; color: var(--orange-600); cursor: pointer; font-weight: 600; text-decoration: underline; }

/* ---------- cartões e elementos */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.dark { background: var(--graphite); color: #fff; border-color: var(--graphite); }
.card h3 { margin-bottom: 6px; }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 700; letter-spacing: .02em; background: var(--light); color: var(--graphite); white-space: nowrap; }
.badge.ok { background: var(--green-50); color: var(--green); }
.badge.warn { background: var(--amber-50); color: var(--amber); }
.badge.err { background: var(--red-50); color: var(--red); }
.badge.info { background: var(--blue-50); color: var(--blue); }
.badge.orange { background: var(--orange-50); color: var(--orange-600); }
.badge.dark { background: var(--graphite); color: #fff; }
.progress { height: 10px; border-radius: 999px; background: var(--light); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--orange); border-radius: inherit; transition: width .4s; }
.card.dark .progress { background: rgba(255,255,255,.15); }
.alert { padding: 14px 16px; border-radius: var(--radius-sm); background: var(--blue-50); color: #173F6D; border-left: 4px solid var(--blue); }
.alert.warn { background: var(--amber-50); color: #6B4200; border-color: var(--amber); }
.alert.err { background: var(--red-50); color: #7A1717; border-color: var(--red); }
.alert.ok { background: var(--green-50); color: #145C33; border-color: var(--green); }
.divider { height: 1px; background: var(--line); margin: 20px 0; border: 0; }
.kpi { display: grid; gap: 4px; }
.kpi .v { font-family: var(--display); font-size: clamp(22px, 2.1vw, 30px); font-weight: 800; line-height: 1.05; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.empty { text-align: center; padding: 40px 16px; color: var(--muted); }
.spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--orange); border-radius: 50%; animation: spin .8s linear infinite; margin: 40px auto; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- formulários */
.field { display: grid; gap: 6px; }
.field label { font-weight: 600; font-size: 14.5px; }
.field .hint { font-size: 13px; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; min-height: 48px; padding: 11px 14px; border-radius: var(--radius-sm); border: 1.5px solid #CFCFCF; background: #fff; font-size: 16px; }
textarea.input { min-height: 110px; resize: vertical; }
.input:focus { border-color: var(--orange); outline: none; box-shadow: 0 0 0 3px rgba(244, 124, 32, .2); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--orange); flex: none; }
.form-grid { display: grid; gap: 14px; }
@media (min-width: 720px) { .form-grid.two { grid-template-columns: 1fr 1fr; } .form-grid .full { grid-column: 1 / -1; } }
.form-error { color: var(--red); font-weight: 600; font-size: 14.5px; min-height: 1.2em; }

/* ---------- tabelas (desktop) / listas (mobile) */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
table.table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.table th, .table td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: #FAFAFA; white-space: nowrap; }
.table tr:last-child td { border-bottom: 0; }
@media (max-width: 719px) {
  .table.responsive thead { display: none; }
  .table.responsive, .table.responsive tbody, .table.responsive tr, .table.responsive td { display: block; width: 100%; }
  .table.responsive tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
  .table.responsive td { border: 0; padding: 4px 14px; }
  .table.responsive td::before { content: attr(data-label); display: block; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
}

/* ---------- site público */
.topbar { background: var(--graphite); color: #fff; }
.site-header { position: sticky; top: 0; z-index: 30; background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.site-header .wrap { display: flex; align-items: center; gap: 16px; min-height: 68px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--graphite); }
.brand img { width: 44px; height: 44px; border-radius: 50%; }
.brand b { font-family: var(--display); font-size: 20px; font-weight: 800; letter-spacing: .02em; line-height: 1; }
.brand small { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.nav { display: none; margin-left: auto; gap: 4px; align-items: center; }
.nav a { text-decoration: none; color: var(--graphite); font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .05em; text-transform: uppercase; padding: 10px 10px; border-radius: 8px; }
.nav a:hover, .nav a.active { color: var(--orange-600); }
.menu-toggle { margin-left: auto; width: 48px; height: 48px; border-radius: 10px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; }
.menu-toggle svg { width: 24px; height: 24px; }
@media (min-width: 1080px) { .nav { display: flex; } .menu-toggle { display: none; } }
.mobile-nav { display: none; border-top: 1px solid var(--line); background: #fff; }
.mobile-nav.open { display: block; }
.mobile-nav a { display: block; padding: 14px 16px; border-bottom: 1px solid var(--light); text-decoration: none; color: var(--graphite); font-family: var(--display); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.mobile-nav .btn { margin: 14px 16px; width: calc(100% - 32px); }

.hero { background: var(--graphite); color: #fff; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%; border: 60px solid rgba(244, 124, 32, .18); }
.hero .wrap { position: relative; z-index: 1; padding-block: 64px 72px; display: grid; gap: 32px; }
@media (min-width: 960px) { .hero .wrap { grid-template-columns: 1.25fr .75fr; align-items: center; padding-block: 96px; } }
.hero h1 { color: #fff; max-width: 18ch; }
.hero h1 span { color: var(--orange); }
.hero p.lead { font-size: 19px; color: #DADADA; max-width: 56ch; }
.hero-card { background: #fff; color: var(--graphite); border-radius: 18px; padding: 22px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.6); }
.section { padding-block: 64px; }
.section.white { background: #fff; }
.section.dark { background: var(--graphite); color: #fff; }
.section-head { max-width: 720px; margin-bottom: 32px; }
.section-head p { color: var(--muted); font-size: 18px; }
.section.dark .section-head p { color: #CFCFCF; }
.steps { counter-reset: s; display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.step { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; position: relative; }
.step::before { counter-increment: s; content: counter(s, decimal-leading-zero); font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--orange); display: block; margin-bottom: 6px; }
.feature { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; }
.feature .ic { width: 44px; height: 44px; border-radius: 12px; background: var(--orange-50); color: var(--orange-600); display: grid; place-items: center; }
.feature .ic svg { width: 24px; height: 24px; }
.site-footer { background: #1A1A1A; color: #BDBDBD; padding-block: 40px 28px; font-size: 14.5px; }
.site-footer a { color: #E6E6E6; text-decoration: none; }
.site-footer .grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }

/* card de curso */
.course-card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.course-card .cover { aspect-ratio: 16 / 9; background: var(--graphite); position: relative; }
.course-card .cover img { width: 100%; height: 100%; object-fit: cover; }
.course-card .cover .badge { position: absolute; left: 12px; top: 12px; }
.course-card .cover .lock { position: absolute; inset: 0; background: rgba(37,37,37,.55); display: grid; place-items: center; color: #fff; }
.course-card .cover .lock svg { width: 44px; height: 44px; }
.course-card .body { padding: 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.course-card .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.course-card .meta b { color: var(--graphite); }
.course-card ul { margin: 0; padding-left: 18px; font-size: 14px; color: var(--muted); }
.course-card .price { font-family: var(--display); font-size: 26px; font-weight: 800; }
.course-card .price s { font-size: 15px; color: var(--gray-2); font-weight: 600; margin-right: 6px; }
.course-card .actions { display: grid; gap: 8px; margin-top: auto; }
@media (min-width: 420px) { .course-card .actions { grid-template-columns: 1fr 1fr; } }

/* ---------- área logada */
.app { min-height: 100vh; display: grid; grid-template-columns: 1fr; }
@media (min-width: 1024px) { .app { grid-template-columns: var(--sidebar) 1fr; } }
.sidebar { display: none; background: var(--graphite); color: #fff; position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 18px 12px; }
@media (min-width: 1024px) { .sidebar { display: flex; flex-direction: column; } }
.sidebar .brand { color: #fff; padding: 4px 8px 18px; }
.sidebar .brand small { color: #BDBDBD; }
.side-nav { display: grid; gap: 2px; }
.side-nav a { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 10px; color: #E3E3E3; text-decoration: none; font-weight: 600; font-size: 15px; }
.side-nav a svg { width: 20px; height: 20px; flex: none; opacity: .85; }
.side-nav a:hover { background: rgba(255,255,255,.07); color: #fff; }
.side-nav a.active { background: var(--orange); color: #fff; }
.side-nav .group { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #9A9A9A; padding: 16px 12px 6px; font-weight: 700; }
.sidebar .foot { margin-top: auto; padding: 12px; font-size: 13px; color: #BDBDBD; }
.main { min-width: 0; padding-bottom: calc(var(--bottom-nav) + 24px + env(safe-area-inset-bottom)); }
@media (min-width: 1024px) { .main { padding-bottom: 40px; } }
.app-top { position: sticky; top: 0; z-index: 20; background: rgba(242,242,242,.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.app-top .wrap { display: flex; align-items: center; gap: 12px; min-height: 60px; }
.app-top .brand img { width: 36px; height: 36px; }
@media (min-width: 1024px) { .app-top .brand { display: none; } }
.icon-btn { position: relative; width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: #fff; display: grid; place-items: center; cursor: pointer; text-decoration: none; color: var(--graphite); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn .dot { position: absolute; top: 6px; right: 6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--orange); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; }
.page { padding-block: 24px; }
.page-head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; }
.page-head h1 { font-size: clamp(24px, 3.4vw, 34px); margin: 0; }

.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); padding-bottom: env(safe-area-inset-bottom); }
@media (min-width: 1024px) { .bottom-nav { display: none; } }
.bottom-nav a, .bottom-nav button { height: var(--bottom-nav); display: grid; place-items: center; align-content: center; gap: 3px; color: var(--muted); text-decoration: none; font-size: 11.5px; font-weight: 700; background: none; border: 0; cursor: pointer; }
.bottom-nav svg { width: 24px; height: 24px; }
.bottom-nav .active { color: var(--orange-600); }
.sheet-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: #fff; border-radius: 20px 20px 0 0; padding: 12px 12px calc(16px + env(safe-area-inset-bottom)); max-height: 80vh; overflow-y: auto; }
.sheet .handle { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 12px; }
.sheet a { display: flex; gap: 12px; align-items: center; padding: 14px 12px; border-radius: 12px; color: var(--graphite); text-decoration: none; font-weight: 600; }
.sheet a svg { width: 22px; height: 22px; color: var(--orange-600); }
.sheet a:active { background: var(--light); }

.hello h1 { font-size: clamp(24px, 3.6vw, 36px); }
.current-course { display: grid; gap: 18px; }
@media (min-width: 860px) { .current-course { grid-template-columns: 1fr auto; align-items: end; } }
.current-course .stats { display: flex; flex-wrap: wrap; gap: 8px 24px; font-size: 14.5px; color: #D5D5D5; }
.current-course .stats b { color: #fff; }

/* módulos */
.module-list { display: grid; gap: 10px; }
.module-item { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: inherit; }
.module-item .num { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--display); font-weight: 800; background: var(--light); }
.module-item.approved .num { background: var(--green); color: #fff; }
.module-item.available .num, .module-item.inprogress .num { background: var(--orange); color: #fff; }
.module-item.locked { opacity: .7; }
.module-item.locked .num svg { width: 18px; height: 18px; }
.module-item .reqs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.req { font-size: 12px; display: inline-flex; align-items: center; gap: 4px; color: var(--muted); }
.req.ok { color: var(--green); }
.req svg { width: 14px; height: 14px; }

/* player */
.player { display: grid; gap: 20px; }
@media (min-width: 1100px) { .player { grid-template-columns: 1fr 320px; align-items: start; } .player aside { position: sticky; top: 76px; } }
.lesson-body { font-size: 17.5px; line-height: 1.7; max-width: 72ch; }
.lesson-body h2 { font-size: 22px; margin-top: 1.4em; }
.lesson-body ul, .lesson-body ol { padding-left: 22px; }
.lesson-body li { margin-bottom: 6px; }
.lesson-body blockquote { margin: 18px 0; padding: 12px 16px; background: var(--orange-50); border-left: 4px solid var(--orange); border-radius: 8px; }
.timer { display: flex; align-items: center; gap: 10px; font-family: var(--display); font-weight: 700; }
.timer .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); }
.timer.paused .dot { background: var(--amber); }
.timer.stopped .dot { background: var(--red); }
.content-tabs { display: grid; gap: 6px; }
.content-tab { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: #fff; text-align: left; cursor: pointer; width: 100%; }
.content-tab.active { border-color: var(--orange); background: var(--orange-50); }
.content-tab svg { width: 18px; height: 18px; flex: none; }
.content-tab .done { color: var(--green); }
.video-frame { aspect-ratio: 16/9; width: 100%; border: 0; border-radius: var(--radius); background: #000; }
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(37,37,37,.7); display: grid; place-items: center; padding: 16px; }
.overlay .card { max-width: 420px; text-align: center; }

/* avaliação */
.question { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
.question .opts { display: grid; gap: 8px; margin-top: 12px; }
.opt { display: flex; gap: 12px; align-items: flex-start; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; min-height: 52px; }
.opt:has(input:checked) { border-color: var(--orange); background: var(--orange-50); }
.opt input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--orange); flex: none; }
.match-row { display: grid; gap: 8px; margin-top: 10px; }
@media (min-width: 640px) { .match-row { grid-template-columns: 1fr 1fr; align-items: center; } }
.exam-bar { position: sticky; top: 60px; z-index: 10; background: var(--graphite); color: #fff; border-radius: var(--radius); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }

/* IA */
.chat { display: grid; grid-template-rows: 1fr auto; height: calc(100vh - 220px); min-height: 420px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.chat-log { overflow-y: auto; padding: 16px; display: grid; gap: 12px; align-content: start; }
.msg { max-width: 85%; padding: 12px 14px; border-radius: 14px; line-height: 1.55; white-space: normal; }
.msg.user { justify-self: end; background: var(--graphite); color: #fff; border-bottom-right-radius: 4px; }
.msg.bot { justify-self: start; background: var(--light); border-bottom-left-radius: 4px; }
.msg .src { margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.chat form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.chat form .input { min-height: 48px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 180px) 1fr 44px; gap: 10px; align-items: center; font-size: 14.5px; }

/* passaporte */
.passport { background: linear-gradient(135deg, #2c2c2c, var(--graphite)); color: #fff; border-radius: 20px; padding: 24px; position: relative; overflow: hidden; }
.passport::after { content: ""; position: absolute; right: -60px; top: -60px; width: 220px; height: 220px; border-radius: 50%; border: 30px solid rgba(244,124,32,.25); }
.cred { display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); }
.cred:last-child { border-bottom: 0; }

/* gráficos */
.chart { width: 100%; height: auto; }
.chart text { font-family: var(--body); font-size: 12px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* toast */
.toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bottom-nav) + 16px + env(safe-area-inset-bottom)); z-index: 80; display: grid; gap: 8px; width: min(92vw, 440px); }
@media (min-width: 1024px) { .toasts { bottom: 24px; } }
.toast { background: var(--graphite); color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); font-weight: 600; }
.toast.err { background: var(--red); }
.toast.ok { background: var(--green); }

/* modal */
dialog.modal { border: 0; border-radius: 18px; padding: 0; width: min(94vw, 640px); max-height: 90vh; box-shadow: 0 30px 80px -20px rgba(0,0,0,.5); }
dialog.modal::backdrop { background: rgba(0,0,0,.5); }
dialog.modal .modal-body { padding: 22px; overflow-y: auto; max-height: calc(90vh - 72px); }
dialog.modal .modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 22px; border-bottom: 1px solid var(--line); }
dialog.modal .modal-head h3 { margin: 0; }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 16px; }
.tabs a, .tabs button { flex: none; padding: 10px 16px; border-radius: 999px; border: 1px solid var(--line); background: #fff; color: var(--graphite); text-decoration: none; font-weight: 700; font-size: 14px; cursor: pointer; }
.tabs .active { background: var(--graphite); color: #fff; border-color: var(--graphite); }
.filters { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 160px), 1fr)); margin-bottom: 16px; }
.cert-validate { max-width: 640px; margin-inline: auto; }
.install-banner { display: none; }
.install-banner.show { display: flex; }
.exam-bar svg { width: 20px; height: 20px; }

.site-header,.app-top{top:env(safe-area-inset-top,0px)}</style>
</head>

nts:169e3,validity_days:365},{id:"9ba53d84-2d4d-4aae-a76a-66e9377d251d",name:"NR-10 · Pacote 50 colaboradores",seats:50,price_cents:745e3,validity_days:365}]},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/dcb2beae-92d0-4a9d-ae65-99a8fa526002":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"dcb2beae-92d0-4a9d-ae65-99a8fa526002",position:1,title:"Introdução à Segurança com Eletricidade",summary:"Objetivo e campo de aplicação da NR-10, níveis de tensão e conceitos básicos.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"6b606c1b-db33-4753-9b5f-2c46fedc627a",title:"Introdução à Segurança com Eletricidade",items:[{id:"cc2f88b2-daa3-47ba-bd54-f078991296f1",type:"TEXTO",title:"Por que a NR-10 existe",body:`A eletricidade é invisível, silenciosa e não avisa antes de causar um acidente. Por isso a NR-10 estabelece requisitos e condições mínimas para implementar medidas de controle e sistemas preventivos que garantam a segurança e a saúde de quem, direta ou indiretamente, interage com instalações elétricas e serviços com eletricidade.

## Onde a NR-10 se aplica
A norma alcança todas as fases da energia elétrica — **geração, transmissão, distribuição e consumo** — e todas as etapas de uma instalação: projeto, construção, montagem, operação e manutenção. Ela vale também para qualquer trabalho realizado **nas proximidades** de instalações elétricas, mesmo que o trabalhador não mexa diretamente nelas (por exemplo, pintores, operadores de guindaste ou jardineiros próximos a redes).

## Níveis de tensão definidos pela NR-10
- **Extra-baixa tensão (EBT):** até 50 V em corrente alternada ou até 120 V em corrente contínua.
- **Baixa tensão (BT):** acima da EBT e até 1000 V em corrente alternada ou 1500 V em corrente contínua.
- **Alta tensão (AT):** acima de 1000 V em corrente alternada ou 1500 V em corrente contínua.

## Conceitos que você vai usar o curso inteiro
- **Instalação energizada:** aquela que possui tensão, ou que pode vir a tê-la.
- **Sistema Elétrico de Potência (SEP):** conjunto de instalações e equipamentos destinados à geração, transmissão e distribuição de energia até a medição.
- **Riscos adicionais:** fatores de risco além dos elétricos, próprios de cada ambiente, que podem afetar a segurança (altura, espaço confinado, umidade etc.).

A regra de ouro que atravessa toda a norma: **toda instalação deve ser considerada energizada até que se prove o contrário**, por meio de procedimentos adequados.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0},{id:"59bc29b0-fe17-416f-aa03-70b5f7588aba",type:"EXERCICIO",title:"Reflexão: a eletricidade no seu trabalho",body:`Liste três situações do seu dia a dia de trabalho em que você está próximo de uma instalação elétrica, mesmo sem executar serviços elétricos.

Para cada uma, responda:
- Que tipo de tensão provavelmente está presente (EBT, BT ou AT)?
- Quem é responsável por aquela instalação?
- O que aconteceria se alguém considerasse o circuito desligado sem verificar?

Guarde suas respostas: elas serão úteis no módulo de análise de risco.`,url:null,min_seconds:300,required:!0,active_seconds:420,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9753,required_seconds:9600},content:{ok:!0,done:2,total:2,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"a9d85869-4dbc-416c-8089-ad45e3f71bdb"}},prev_module_id:null,next_module_id:"88709778-e98a-415f-b85c-7159e59ebff0"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/88709778-e98a-415f-b85c-7159e59ebff0":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"88709778-e98a-415f-b85c-7159e59ebff0",position:2,title:"Riscos em Instalações e Serviços com Eletricidade",summary:"Choque elétrico, arco elétrico, queimaduras, campos eletromagnéticos e seus efeitos no corpo.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"75ae3bea-08a3-4719-8860-0c709a6c880b",title:"Riscos em Instalações e Serviços com Eletricidade",items:[{id:"36de4cb8-1a5a-44dc-99c7-77eaa07478a6",type:"TEXTO",title:"Choque elétrico e seus efeitos",body:`O **choque elétrico** é a passagem de corrente elétrica pelo corpo humano. A gravidade depende principalmente da **intensidade da corrente**, do **caminho** que ela percorre (atravessar o coração é o pior cenário), do **tempo de exposição**, da **frequência** e das condições da pele (umidade, suor, ferimentos).

## Efeitos fisiológicos, do mais leve ao mais grave
- **Percepção:** formigamento, sem dano direto — mas pode causar quedas por reflexo.
- **Tetanização:** contração involuntária dos músculos; a pessoa pode não conseguir soltar o condutor.
- **Parada respiratória:** a corrente atinge os músculos envolvidos na respiração.
- **Fibrilação ventricular:** o coração passa a tremer em vez de bombear sangue. Sem socorro imediato, leva à morte.
- **Queimaduras:** internas e externas, nos pontos de entrada e saída da corrente e ao longo do trajeto.

## Contato direto e indireto
- **Contato direto:** tocar uma parte que normalmente está energizada (um barramento, um fio desencapado).
- **Contato indireto:** tocar uma massa que ficou energizada por uma falha de isolamento (a carcaça de um motor, por exemplo).`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0},{id:"29cba007-80f3-4824-9c02-f5f75c2418d7",type:"TEXTO",title:"Arco elétrico e campos eletromagnéticos",body:`O **arco elétrico** é uma descarga através do ar entre partes com potenciais diferentes. Pode surgir em curtos-circuitos, na abertura de circuitos sob carga ou pela aproximação de ferramentas a partes energizadas.

## Por que o arco é tão perigoso
- Temperaturas extremamente altas, capazes de causar queimaduras graves a distância.
- Radiação intensa (ultravioleta e infravermelha), que lesiona olhos e pele.
- Projeção de metal fundido e fragmentos.
- Onda de pressão, que pode arremessar o trabalhador e causar lesões auditivas.

Por isso a NR-10 exige vestimentas adequadas às influências eletromagnéticas e à inflamabilidade, e o uso de EPI compatível com o risco avaliado.

## Campos eletromagnéticos
Instalações de alta tensão e grandes correntes geram campos elétricos e magnéticos intensos. A exposição deve ser avaliada, e trabalhadores com implantes eletrônicos (como marcapassos) exigem atenção especial, pois o campo pode interferir no funcionamento desses dispositivos.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0},{id:"06b427fa-13ae-42bc-a128-0ca71f591794",type:"ESTUDO_DE_CASO",title:"Caso: a carcaça energizada",body:`Um operador encosta na carcaça metálica de uma bomba d'água e sente um choque forte. A carcaça não deveria ter tensão.

Analise:
- Trata-se de contato direto ou indireto?
- Que falhas podem ter permitido que a carcaça ficasse energizada?
- Que medidas de proteção deveriam ter atuado (pense em aterramento e em dispositivos de proteção)?

Resposta comentada: é um **contato indireto** — a massa ficou energizada por falha de isolamento. O aterramento da massa, associado a um dispositivo de seccionamento automático (como um dispositivo diferencial-residual), deveria ter desligado o circuito.`,url:null,min_seconds:420,required:!0,active_seconds:540,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9768,required_seconds:9600},content:{ok:!0,done:3,total:3,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:80,min_score_pct:60,exam_id:"2a6d7e67-674e-4a61-b7c4-8d3b6d21f78f"}},prev_module_id:"dcb2beae-92d0-4a9d-ae65-99a8fa526002",next_module_id:"274224fc-ef3a-4bb9-bb91-cfc89d98cbc5"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/274224fc-ef3a-4bb9-bb91-cfc89d98cbc5":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"274224fc-ef3a-4bb9-bb91-cfc89d98cbc5",position:3,title:"Técnicas de Análise de Risco",summary:"Identificação de perigos, avaliação de riscos e ferramentas como APR e checklist.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"0cabee49-d575-4578-a2a0-268b6b9f0aa9",title:"Técnicas de Análise de Risco",items:[{id:"59e75eed-1352-4ab8-afb4-f28b37f74cfb",type:"TEXTO",title:"Perigo, risco e análise de risco",body:`**Perigo** é a fonte com potencial de causar dano (um painel energizado). **Risco** é a combinação da probabilidade de um evento acontecer com a gravidade do dano (a chance de um choque durante a manutenção desse painel e quão grave ele seria).

A NR-10 exige que os serviços em instalações elétricas sejam precedidos de **análise de risco**, e a NR-01 organiza isso dentro do Gerenciamento de Riscos Ocupacionais (GRO).

## Etapas de uma análise de risco
1. **Descrever a tarefa** passo a passo.
2. **Identificar os perigos** de cada passo (elétricos e adicionais).
3. **Avaliar** probabilidade e gravidade.
4. **Definir medidas de controle**, seguindo a hierarquia: eliminar, substituir, controles de engenharia (EPC), controles administrativos (procedimentos, sinalização, permissão de trabalho) e, por último, EPI.
5. **Comunicar** a equipe e registrar.
6. **Revisar** sempre que algo mudar no local ou na tarefa.

## Ferramentas comuns
- **APR (Análise Preliminar de Risco):** tabela com etapas, perigos, consequências e medidas de controle. É a mais usada no campo.
- **Checklist:** lista de verificação antes de iniciar.
- **What-if ("E se...?"):** a equipe questiona o que pode dar errado.
- **HAZOP e FMEA:** técnicas mais detalhadas para processos e equipamentos complexos.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0},{id:"ae41d34d-cbd4-46a6-bf74-8d447d7f3de9",type:"EXERCICIO",title:"Monte uma APR",body:`Monte uma APR simples para a tarefa: **substituir um disjuntor em um quadro de distribuição de baixa tensão**.

Use as colunas: Etapa | Perigo | Consequência | Medida de controle.

Dica: inclua a etapa de desenergização completa e não se esqueça dos riscos adicionais (iluminação do local, piso molhado, posição de trabalho).`,url:null,min_seconds:420,required:!0,active_seconds:540,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9627,required_seconds:9600},content:{ok:!0,done:2,total:2,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"ba885f5d-7add-4179-9f8f-0b73b343a105"}},prev_module_id:"88709778-e98a-415f-b85c-7159e59ebff0",next_module_id:"d18c120c-ddfd-4e9f-b3cf-09885d20c4c1"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/d18c120c-ddfd-4e9f-b3cf-09885d20c4c1":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"d18c120c-ddfd-4e9f-b3cf-09885d20c4c1",position:4,title:"Medidas de Controle do Risco Elétrico",summary:"Desenergização, aterramento, equipotencialização, seccionamento automático, barreiras e bloqueios.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"407d39f8-ebcd-47dd-9d04-fc5d41cf727d",title:"Medidas de Controle do Risco Elétrico",items:[{id:"3c612919-ad25-4f7d-a169-daa8ce121c5c",type:"TEXTO",title:"Desenergização: a principal medida",body:`A NR-10 determina que as medidas de proteção coletiva priorizem a **desenergização**. Somente são consideradas desenergizadas as instalações liberadas para trabalho mediante a seguinte sequência:

1. **Seccionamento** — abrir o circuito com dispositivo adequado.
2. **Impedimento de reenergização** — bloquear e etiquetar (bloqueio mecânico, cadeado, etiqueta com identificação do responsável).
3. **Constatação da ausência de tensão** — com detector ou instrumento adequado, testado antes e depois do uso.
4. **Instalação de aterramento temporário com equipotencialização** dos condutores dos circuitos.
5. **Proteção dos elementos energizados** existentes na zona controlada.
6. **Instalação da sinalização de impedimento de reenergização.**

A reenergização também segue uma sequência: retirar ferramentas e pessoas da zona controlada, retirar o aterramento temporário e as proteções adicionais, retirar a sinalização, destravar e religar os dispositivos de seccionamento.

## Tensão de segurança
Quando a desenergização não for possível, a NR-10 indica o emprego de **tensão de segurança** (extra-baixa tensão). Não sendo possível nenhuma das duas, adotam-se outras medidas: isolação das partes vivas, obstáculos, barreiras, sinalização, seccionamento automático da alimentação e bloqueio do religamento automático.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0},{id:"f6fb1dfd-77b4-41a0-a130-f8c8909a3034",type:"TEXTO",title:"Aterramento, equipotencialização e seccionamento automático",body:`## Aterramento
É a ligação intencional à terra. O **aterramento de proteção** conecta as massas (carcaças) para que, em caso de falha, a corrente tenha um caminho seguro e os dispositivos de proteção atuem. O **aterramento temporário** é instalado durante a manutenção para proteger o trabalhador contra energização acidental.

## Equipotencialização
É ligar eletricamente partes condutoras para que fiquem no **mesmo potencial**. Sem diferença de potencial entre as partes que o trabalhador pode tocar, não há circulação de corrente pelo corpo.

## Seccionamento automático da alimentação
Dispositivos como disjuntores, fusíveis e **dispositivos diferenciais-residuais (DR)** desligam o circuito automaticamente em caso de sobrecorrente ou fuga de corrente. O DR de alta sensibilidade é uma importante proteção complementar contra choques.

## Barreiras, obstáculos e bloqueios
- **Barreira:** impede o contato com partes energizadas em qualquer direção de acesso.
- **Obstáculo:** impede o contato acidental, mas não o intencional.
- **Bloqueio:** dispositivo que mantém um equipamento na posição de desligado, com cadeado e etiqueta.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0},{id:"4b7f675b-77f7-445f-86e6-1d3dc7f7b867",type:"SIMULACAO",title:"Simulação: ordene a desenergização",body:`Coloque as etapas na ordem correta antes de conferir a resposta:

- ( ) Instalação de aterramento temporário com equipotencialização
- ( ) Seccionamento
- ( ) Sinalização de impedimento de reenergização
- ( ) Constatação da ausência de tensão
- ( ) Impedimento de reenergização
- ( ) Proteção dos elementos energizados na zona controlada

Resposta: seccionamento → impedimento de reenergização → constatação da ausência de tensão → aterramento temporário com equipotencialização → proteção dos elementos energizados → sinalização de impedimento de reenergização.`,url:null,min_seconds:300,required:!0,active_seconds:420,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:10083,required_seconds:9600},content:{ok:!0,done:3,total:3,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"27912249-a4d0-489e-bdb0-4b43e93a6acc"}},prev_module_id:"274224fc-ef3a-4bb9-bb91-cfc89d98cbc5",next_module_id:"7cab93b2-fbef-49dc-abae-b6efee936f56"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/7cab93b2-fbef-49dc-abae-b6efee936f56":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"7cab93b2-fbef-49dc-abae-b6efee936f56",position:5,title:"Normas Técnicas Brasileiras",summary:"O papel das normas ABNT: NBR 5410, NBR 14039 e demais referências.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"fd45982d-07e7-48c4-a3bc-60349d7ece36",title:"Normas Técnicas Brasileiras",items:[{id:"17ad6818-705e-45c0-9b4f-eaf8e3305cf8",type:"TEXTO",title:"NR e NBR: qual a diferença?",body:`As **Normas Regulamentadoras (NRs)** são atos do Ministério do Trabalho e Emprego, de cumprimento obrigatório pelas empresas. As **Normas Brasileiras (NBRs)** são normas técnicas elaboradas pela ABNT, que definem como projetar, executar e manter instalações de forma segura. A NR-10 remete às normas técnicas oficiais: na prática, uma instalação que não atende às NBRs aplicáveis dificilmente atende à NR-10.

## ABNT NBR 5410 – Instalações elétricas de baixa tensão
Aplica-se a instalações alimentadas em tensão até 1000 V em corrente alternada ou 1500 V em corrente contínua: residências, comércio, indústrias e prédios públicos. Trata de temas como proteção contra choques (contatos diretos e indiretos), proteção contra sobrecorrentes, dimensionamento de condutores, uso de dispositivos DR, aterramento e esquemas de aterramento, e verificação final da instalação.

## ABNT NBR 14039 – Instalações elétricas de média tensão
Aplica-se a instalações de média tensão, na faixa de 1,0 kV a 36,2 kV — por exemplo, subestações de entrada de indústrias e grandes edifícios. Estabelece requisitos de projeto, proteção, manobra e segurança para esses sistemas.

## Outras referências pertinentes
- **ABNT NBR 5419:** proteção contra descargas atmosféricas (SPDA).
- Normas de ensaio e especificação de EPI e ferramentas isolantes.
- Normas das concessionárias locais para padrões de entrada de energia.

> Importante: as normas ABNT são documentos protegidos por direitos autorais. Consulte sempre a versão vigente e oficial, adquirida junto à ABNT ou disponibilizada pela sua empresa. Este curso apresenta o papel e o escopo dessas normas, não o seu texto.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9802,required_seconds:9600},content:{ok:!0,done:1,total:1,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"d7ec6e16-80b2-4655-8e9e-344404255aa9"}},prev_module_id:"d18c120c-ddfd-4e9f-b3cf-09885d20c4c1",next_module_id:"814e53c3-34ad-458a-9fc4-8d03198f4dcf"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/814e53c3-34ad-458a-9fc4-8d03198f4dcf":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"814e53c3-34ad-458a-9fc4-8d03198f4dcf",position:6,title:"Normas Regulamentadoras",summary:"A NR-10 no conjunto das NRs: NR-01, NR-06, NR-35, NR-33 e outras relacionadas.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"3c09b19e-0b53-4bd4-8a15-e9869ff243c6",title:"Normas Regulamentadoras",items:[{id:"8c123d58-b75e-41e2-b974-69d3e3a8a1a9",type:"TEXTO",title:"A NR-10 não trabalha sozinha",body:`As Normas Regulamentadoras formam um sistema. Em um serviço elétrico, várias delas se aplicam ao mesmo tempo.

- **NR-01 – Disposições gerais e Gerenciamento de Riscos Ocupacionais:** define o GRO e o PGR, a base para identificar perigos e avaliar riscos. Também traz as diretrizes para capacitações a distância e semipresenciais.
- **NR-05 – CIPA:** comissão que participa da prevenção de acidentes na empresa.
- **NR-06 – EPI:** regras de fornecimento, uso e Certificado de Aprovação (CA) dos equipamentos de proteção individual.
- **NR-07 – PCMSO:** controle médico, incluindo a aptidão para trabalhos com eletricidade.
- **NR-10 – Segurança em Instalações e Serviços em Eletricidade.**
- **NR-12 – Máquinas e Equipamentos:** inclui requisitos elétricos das máquinas.
- **NR-23 – Proteção contra incêndios.**
- **NR-26 – Sinalização de segurança.**
- **NR-33 – Espaços confinados:** quando o serviço elétrico é feito em galerias, poços ou tanques.
- **NR-35 – Trabalho em altura:** postes, estruturas, escadas e plataformas acima de 2 metros.

## Qualificação, habilitação, capacitação e autorização (NR-10)
- **Qualificado:** comprova conclusão de curso específico na área elétrica reconhecido pelo sistema oficial de ensino.
- **Habilitado:** previamente qualificado e com registro no conselho de classe competente.
- **Capacitado:** recebe capacitação sob orientação e responsabilidade de profissional habilitado e autorizado, e trabalha sob a responsabilidade desse profissional.
- **Autorizado:** trabalhador qualificado, capacitado ou habilitado **com anuência formal da empresa**.

> Concluir este curso é um dos requisitos, mas a autorização para trabalhar em instalações elétricas é sempre um ato formal do empregador.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9633,required_seconds:9600},content:{ok:!0,done:1,total:1,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"9c65d0b4-bda1-4148-9de5-feeba5cdecde"}},prev_module_id:"7cab93b2-fbef-49dc-abae-b6efee936f56",next_module_id:"758ea658-2d02-4e3f-aae2-f0ddcc75121d"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/758ea658-2d02-4e3f-aae2-f0ddcc75121d":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"758ea658-2d02-4e3f-aae2-f0ddcc75121d",position:7,title:"Equipamentos de Proteção Coletiva",summary:"Tipos de EPC, finalidade, conservação e prioridade sobre o EPI.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"4b97dbb8-5d2f-4a17-a4b7-55a6f735d232",title:"Equipamentos de Proteção Coletiva",items:[{id:"96f54cdd-250d-4e97-a365-b2f38b984f07",type:"TEXTO",title:"EPC: proteção para todos no local",body:`Os **Equipamentos de Proteção Coletiva (EPC)** protegem simultaneamente todos os trabalhadores expostos a um risco. Por isso a NR-10 os coloca à frente do EPI: primeiro se protege o ambiente, depois o indivíduo.

## Exemplos de EPC em serviços com eletricidade
- **Conjunto de aterramento temporário** (grampos, cabos e trado ou haste).
- **Detectores de ausência de tensão.**
- **Tapetes e mantas isolantes**, coberturas e protetores para condutores.
- **Barreiras, anteparos e grades** que impedem o acesso a partes energizadas.
- **Cones, fitas, correntes e placas** de sinalização e isolamento de área.
- **Dispositivos de bloqueio** (cadeados, garras multibloqueio, etiquetas de impedimento).
- **Dispositivos de seccionamento automático**, como DRs e disjuntores.

## Cuidados com os EPC
- Devem ser **adequados ao nível de tensão** e à atividade.
- Precisam de **inspeção antes do uso** e de ensaios periódicos, conforme o fabricante e as normas técnicas.
- Devem estar especificados na documentação da empresa e, quando aplicável, no Prontuário das Instalações Elétricas.
- Nunca improvise: um EPC danificado deve ser retirado de uso e identificado.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9902,required_seconds:9600},content:{ok:!0,done:1,total:1,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"cba5071b-b681-40f6-9baf-c828cf396e16"}},prev_module_id:"814e53c3-34ad-458a-9fc4-8d03198f4dcf",next_module_id:"6f91e810-cefc-4c67-9d6f-09f03e426fd2"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/6f91e810-cefc-4c67-9d6f-09f03e426fd2":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"6f91e810-cefc-4c67-9d6f-09f03e426fd2",position:8,title:"Equipamentos de Proteção Individual",summary:"EPI para eletricidade, vestimentas, CA, inspeção e proibição de adornos.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"9dbee7ec-ebc7-4a01-9b3d-d154b2bd99af",title:"Equipamentos de Proteção Individual",items:[{id:"4025ea64-4bbf-4d1a-acf4-0c5357aad7ab",type:"TEXTO",title:"EPI: a última barreira",body:`Quando as medidas de proteção coletiva forem tecnicamente inviáveis ou insuficientes para controlar os riscos, devem ser adotados **EPIs específicos e adequados às atividades**, conforme a NR-06. Todo EPI precisa ter **Certificado de Aprovação (CA)** válido.

## EPIs comuns em serviços com eletricidade
- **Capacete** com isolamento elétrico adequado.
- **Óculos de proteção** e **protetor facial** contra arco elétrico.
- **Luvas isolantes** de borracha, da classe compatível com a tensão, usadas com **luvas de cobertura** (proteção mecânica).
- **Vestimenta de proteção** contra os efeitos térmicos do arco elétrico, adequada ao nível de energia avaliado.
- **Calçados de segurança** sem partes metálicas expostas e com isolamento elétrico.
- **Cinturão de segurança** quando houver trabalho em altura (NR-35).

## Vestimentas e adornos
A NR-10 determina que as vestimentas de trabalho sejam adequadas às atividades, considerando **condutibilidade, inflamabilidade e influências eletromagnéticas**. Também é **proibido o uso de adornos pessoais** — anéis, alianças, pulseiras, relógios, correntes, piercings — em trabalhos com instalações elétricas ou em suas proximidades.

## Inspeção e conservação
- Inspecione antes de cada uso. Luvas isolantes devem passar por teste de inflamento (verificação de furos) e ensaios periódicos.
- Guarde longe de calor, umidade, óleo e objetos cortantes.
- A empresa fornece, treina e fiscaliza o uso; o trabalhador usa, guarda, conserva e comunica qualquer dano.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9762,required_seconds:9600},content:{ok:!0,done:1,total:1,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"70b47e6e-4a9f-40c4-bfe7-c7a7528d24bb"}},prev_module_id:"758ea658-2d02-4e3f-aae2-f0ddcc75121d",next_module_id:"9f86367d-2c7a-459f-aca1-a37a6b51bd76"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/9f86367d-2c7a-459f-aca1-a37a6b51bd76":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"9f86367d-2c7a-459f-aca1-a37a6b51bd76",position:9,title:"Rotinas de Trabalho e Procedimentos",summary:"Instalações desenergizadas, liberação para serviços, sinalização, inspeções e procedimentos.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"2cf7aeeb-b68e-4b51-8de5-01f5948abf18",title:"Rotinas de Trabalho e Procedimentos",items:[{id:"68f7906c-e2dd-40bb-91dc-112320595ade",type:"TEXTO",title:"Procedimentos e ordens de serviço",body:`A NR-10 exige que os serviços em instalações elétricas sejam planejados e realizados conforme **procedimentos de trabalho específicos, padronizados**, com descrição detalhada de cada tarefa, passo a passo, assinados por profissional que atenda aos requisitos da norma.

## O que um procedimento deve conter
Objetivo, campo de aplicação, base técnica, competências e responsabilidades, disposições gerais, medidas de controle e orientações finais.

## Ordem de serviço
Os serviços devem ser precedidos de **ordens de serviço específicas**, aprovadas por trabalhador autorizado, contendo no mínimo **tipo, data, local e referências aos procedimentos** a serem adotados.

## Rotinas que salvam vidas
- **Liberação para serviço:** só após a desenergização completa e a verificação pelo responsável.
- **Bloqueio e etiquetagem (LOTO):** cada trabalhador coloca seu próprio cadeado; o equipamento só é religado quando todos retirarem os seus.
- **Sinalização:** identificação de circuitos, travamentos, restrições de acesso, delimitação de áreas e advertências.
- **Comunicação:** equipe alinhada sobre quem faz o quê, antes de começar (diálogo de segurança).
- **Inspeções:** de ferramentas, EPIs, EPCs e do local, antes e depois do serviço.
- **Trabalho em instalações energizadas em alta tensão:** não pode ser realizado individualmente.

## Direito de recusa
Sempre que constatar evidências de **riscos graves e iminentes** para sua segurança ou a de outras pessoas, o trabalhador deve interromper a tarefa e comunicar imediatamente o superior hierárquico.`,url:null,min_seconds:900,required:!0,active_seconds:1020,completed:!0},{id:"e0932eb4-1083-47de-931b-c0c300c00e76",type:"ESTUDO_DE_CASO",title:"Caso: o religamento inesperado",body:`Dois eletricistas fazem manutenção em um motor. O primeiro desliga o disjuntor e coloca seu cadeado. O segundo chega depois e começa a trabalhar sem colocar o próprio cadeado. O primeiro termina sua parte, retira o cadeado e religa o circuito — com o colega ainda nos terminais.

Perguntas:
- Qual regra de bloqueio foi violada?
- Que etapa da comunicação falhou?
- Como uma ordem de serviço e uma APR poderiam ter evitado o acidente?

Resposta comentada: cada trabalhador deve colocar **o seu próprio bloqueio**; o religamento só ocorre após a retirada de todos os bloqueios e a confirmação de que ninguém está na zona de trabalho.`,url:null,min_seconds:420,required:!0,active_seconds:540,completed:!0}]}],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:9601,required_seconds:9600},content:{ok:!0,done:2,total:2,pct:100,required_pct:100},exam:{ok:!0,best_score_pct:100,min_score_pct:60,exam_id:"b9d93c07-f6fb-4860-9170-8400d9c05566"}},prev_module_id:"6f91e810-cefc-4c67-9d6f-09f03e426fd2",next_module_id:"2888a0ff-cf50-4368-b358-7582f2963756"},"GET /me/enrollments/ce116da4-abda-401c-901b-2a01bfe413d8/modules/2888a0ff-cf50-4368-b358-7582f2963756":{enrollment_id:"ce116da4-abda-401c-901b-2a01bfe413d8",module:{id:"2888a0ff-cf50-4368-b358-7582f2963756",position:10,title:"Documentação de Instalações Elétricas",summary:"Esquemas unifilares, Prontuário das Instalações Elétricas e registros obrigatórios.",min_minutes:160},course:{id:"3c758ee9-9313-49f8-b115-b750c08bfb85",code:"NR-10"},lessons:[{id:"bfd15a87-5573-4f7f-88f1-4247ab930dd2",title:"Documentação de Instalações Elétricas",items:[{id:"1c63f0bb-55ea-4bf9-bdb8-fcb055350416",type:"TEXTO",title:"O que precisa estar documentado",body:`A documentação é o que permite trabalhar com base em informação, e não em suposição. A NR-10 exige que as empresas mantenham **esquemas unifilares atualizados** das instalações elétricas, com as especificações do sistema de aterramento e dos demais equipamentos e dispositivos de proteção.

## Prontuário das Instalações Elétricas (PIE)
Estabelecimentos com **carga instalada superior a 75 kW** devem constituir e manter o Prontuário, que reúne, entre outros itens:
- o conjunto de **procedimentos e instruções técnicas e administrativas** de segurança e saúde;
- a documentação das **inspeções e medições do SPDA e dos aterramentos**;
- a **especificação dos EPC, EPI e ferramental** aplicáveis;
- a documentação comprobatória da **qualificação, habilitação, capacitação, autorização** e dos treinamentos dos trabalhadores;
- os resultados dos **testes de isolação** de EPI e EPC;
- as **certificações** dos equipamentos e materiais elétricos em áreas classificadas;
- o **relatório técnico das inspeções**, com recomendações e cronogramas de adequação.

Empresas que operam no SEP, ou em suas proximidades, têm exigências adicionais de documentação.

## Boas práticas
- O prontuário deve ficar à disposição dos trabalhadores envolvidos e da fiscalização.
- Deve ser organizado e mantido atualizado por responsável designado pela empresa.
- Sempre que a instalação for modificada, os diagramas precisam ser revisados antes que alguém trabalhe com base neles.`,url:null,min_seconds:900,required:!0,active_seconds:960,completed:!0}]}],status:"EM_ANDAMENTO",requirements:{time:{ok:!1,current_seconds:7200,required_seconds:9600},content:{ok:!0,done:1,total:1,pct:100,required_pct:100},exam:{ok:!1,best_score_pct:null,min_score_pct:60,exam_id:"0c241abd-f4aa-4f37-be6b-1ab3e941adb9"}},prev_module_id:"9f86367d-2c7a-459f-aca1-a37a6b51bd76",next_module_id:"f877bf60-1ff2-44ca-ba4c-a7bc5e00a9f1"},"GET /me/enrollments/d65535eb-671f-489f-9e20-0db7d02d0133/modules/9d84d148-3a75-4aac-93c8-90793b758efd":{enrollment_id:"d65535eb-671f-489f-9e20-0db7d02d0133",module:{id:"9d84d148-3a75-4aac-93c8-90793b758efd",position:1,title:"Histórico da regulamentação de segurança em máquinas",summary:null,min_minutes:96},course:{id:"0878f6e1-b7d8-4fb4-b4f8-54a7f7dcf357",code:"NR-12"},lessons:[],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:6186,required_seconds:5760},content:{ok:!0,done:0,total:0,pct:100,required_pct:100},exam:{ok:!0,none:!0}},prev_module_id:null,next_module_id:"c9e2dd64-dd9c-4497-83ca-99e7ca60bc83"},"GET /me/enrollments/d65535eb-671f-489f-9e20-0db7d02d0133/modules/c9e2dd64-dd9c-4497-83ca-99e7ca60bc83":{enrollment_id:"d65535eb-671f-489f-9e20-0db7d02d0133",module:{id:"c9e2dd64-dd9c-4497-83ca-99e7ca60bc83",position:2,title:"Riscos associados a máquinas e equipamentos",summary:null,min_minutes:96},course:{id:"0878f6e1-b7d8-4fb4-b4f8-54a7f7dcf357",code:"NR-12"},lessons:[],status:"APROVADO",requirements:{time:{ok:!0,current_seconds:6162,required_seconds:5760},content:{ok:!0,done:0,total:0,pct:100,required_pct:100},exam:{ok:!0,none:!0}},prev_module_id:"9d84d148-3a75-4aac-93c8-90793b758efd",next_module_id:"ccde6458-74d9-4abf-8209-b63ce94fbd4c"},"GET /me/enrollments/d65535eb-671f-489f-9e20-0db7d02d0133/modules/ccde6458-74d9-4abf-8209-b63ce94fbd4c":{enrollment_id:"d65535eb-671f-489f-9e20-0db7d02d0133",module:{id:"ccde64 -abe9-792155a8fee7",title:"Infográfico: checklist de riscos adicionais",type:"INFOGRAFICO",source:"IA",review_status:"RASCUNHO",created_at:"2026-09-29T01:31:18.732Z",code:"NR-10",module_position:11,module_title:"Riscos Adicionais"}],questions:[{id:"f75d9705-2918-4dc8-a0f1-761752ad224e",topic:"Riscos adicionais",statement:"Em um serviço elétrico em ambiente com umidade elevada, qual é o principal efeito sobre o risco de choque?",source:"IA",review_status:"RASCUNHO",code:"NR-10",module_position:11},{id:"15e03b12-934d-4111-b26c-150bca02834d",topic:"Riscos adicionais",statement:"Equipamentos elétricos instalados em áreas classificadas devem:",source:"IA",review_status:"RASCUNHO",code:"NR-10",module_position:11}]},"GET /admin/resources/lessons?module_id=dcb2beae-92d0-4a9d-ae65-99a8fa526002":[{id:"6b606c1b-db33-4753-9b5f-2c46fedc627a",module_id:"dcb2beae-92d0-4a9d-ae65-99a8fa526002",position:1,title:"Introdução à Segurança com Eletricidade"}],"GET /admin/resources/content?lesson_id=6b606c1b-db33-4753-9b5f-2c46fedc627a":[{id:"cc2f88b2-daa3-47ba-bd54-f078991296f1",lesson_id:"6b606c1b-db33-4753-9b5f-2c46fedc627a",position:1,type:"TEXTO",title:"Por que a NR-10 existe",body:`A eletricidade é invisível, silenciosa e não avisa antes de causar um acidente. Por isso a NR-10 estabelece requisitos e condições mínimas para implementar medidas de controle e sistemas preventivos que garantam a segurança e a saúde de quem, direta ou indiretamente, interage com instalações elétricas e serviços com eletricidade.

## Onde a NR-10 se aplica
A norma alcança todas as fases da energia elétrica — **geração, transmissão, distribuição e consumo** — e todas as etapas de uma instalação: projeto, construção, montagem, operação e manutenção. Ela vale também para qualquer trabalho realizado **nas proximidades** de instalações elétricas, mesmo que o trabalhador não mexa diretamente nelas (por exemplo, pintores, operadores de guindaste ou jardineiros próximos a redes).

## Níveis de tensão definidos pela NR-10
- **Extra-baixa tensão (EBT):** até 50 V em corrente alternada ou até 120 V em corrente contínua.
- **Baixa tensão (BT):** acima da EBT e até 1000 V em corrente alternada ou 1500 V em corrente contínua.
- **Alta tensão (AT):** acima de 1000 V em corrente alternada ou 1500 V em corrente contínua.

## Conceitos que você vai usar o curso inteiro
- **Instalação energizada:** aquela que possui tensão, ou que pode vir a tê-la.
- **Sistema Elétrico de Potência (SEP):** conjunto de instalações e equipamentos destinados à geração, transmissão e distribuição de energia até a medição.
- **Riscos adicionais:** fatores de risco além dos elétricos, próprios de cada ambiente, que podem afetar a segurança (altura, espaço confinado, umidade etc.).

A regra de ouro que atravessa toda a norma: **toda instalação deve ser considerada energizada até que se prove o contrário**, por meio de procedimentos adequados.`,url:null,min_seconds:900,required:1,source:"SEED",review_status:"APROVADO",review_note:"Aprovação de demonstração (seed --demo). Revisar por responsável técnico antes da produção.",author_id:null,reviewed_by:"2242f406-8275-457a-a7a3-96878391e7e0",reviewed_at:"2026-09-29T01:31:12.780Z",created_at:"2026-09-29T01:31:12.772Z"},{id:"59bc29b0-fe17-416f-aa03-70b5f7588aba",lesson_id:"6b606c1b-db33-4753-9b5f-2c46fedc627a",position:2,type:"EXERCICIO",title:"Reflexão: a eletricidade no seu trabalho",body:`Liste três situações do seu dia a dia de trabalho em que você está próximo de uma instalação elétrica, mesmo sem executar serviços elétricos.

Para cada uma, responda:

É a ligação intencional à terra. O **aterramento de proteção** conecta as massas (carcaças) para que, em caso de falha, a corrente tenha um caminho seguro e os dispositivos de proteção atuem. O **aterramento temporário** é instalado durante a manutenção para proteger o trabalhador contra energização acidental.

## Equipotencialização
É ligar eletricamente partes condutoras para que fiquem no **mesmo potencial**. Sem diferença de potencial entre as partes que o trabalhador pode tocar, não há circulação de corrente pelo corpo.

**NR-10 · Módulo 04 – Simulação: ordene a desenergização**
Resposta: seccionamento → impedimento de reenergização → constatação da ausência de tensão → aterramento temporário com equipotencialização → proteção dos elementos energizados → sinalização de impedimento de reenergização.

A documentação é o que permite trabalhar com base em informação, e não em suposição. A NR-10 exige que as empresas mantenham **esquemas unifilares atualizados** das instalações elétricas, com as especificações do sistema de aterramento e dos demais equipamentos e dispositivos de proteção.

**NR-10 · Módulo 07 – EPC: proteção para todos no local**
## Cuidados com os EPC
- Devem ser **adequados ao nível de tensão** e à atividade.
- Precisam de **inspeção antes do uso** e de ensaios periódicos, conforme o fabricante e as normas técnicas.
- Devem estar especificados na documentação da empresa e, quando aplicável, no Prontuário das Instalações Elétricas.
- Nunca improvise: um EPC danificado deve ser retirado de uso e identificado.

**NR-10 · Módulo 10 – O que precisa estar documentado**
Empresas que operam no SEP, ou em suas proximidades, têm exigências adicionais de documentação.

## Boas práticas
- O prontuário deve ficar à disposição dos trabalhadores envolvidos e da fiscalização.
- Deve ser organizado e mantido atualizado por responsável designado pela empresa.

O **choque elétrico** é a passagem de corrente elétrica pelo corpo humano. A gravidade depende principalmente da **intensidade da corrente**, do **caminho** que ela percorre (atravessar o coração é o pior cenário), do **tempo de exposição**, da **frequência** e das condições da pele (umidade, suor, ferimentos).

- **Percepção:** formigamento, sem dano direto — mas pode causar quedas por reflexo.
- **Tetanização:** contração involuntária dos músculos; a pessoa pode não conseguir soltar o condutor.
- **Parada respiratória:** a corrente atinge os músculos envolvidos na respiração.

**NR-10 · Módulo 03 – Perigo, risco e análise de risco**
## Etapas de uma análise de risco
1. **Descrever a tarefa** passo a passo.
2. **Identificar os perigos** de cada passo (elétricos e adicionais).
3. **Avaliar** probabilidade e gravidade.
4. **Definir medidas de controle**, seguindo a hierarquia: eliminar, substituir, controles de engenharia (EPC), controles administrativos (procedimentos, sinalização, permissão de trabalho) e, por último, EPI.
5. **Comunicar** a equipe e registrar.
6. **Revisar** sempre que algo mudar no local ou na tarefa.

**NR-10 · Módulo 10 – O que precisa estar documentado**
A documentação é o que permite trabalhar com base em informação, e não em suposição. A NR-10 exige que as empresas mantenham **esquemas unifilares atualizados** das instalações elétricas, com as especificações do sistema de aterramento e dos demais equipamentos e dispositivos de proteção.

Estabelecimentos com **carga instalada superior a 75 kW** devem constituir e manter o Prontuário, que reúne, entre outros itens:
- o conjunto de **procedimentos e instruções técnicas e administrativas** de segurança e saúde;
- a documentação das **inspeções e medições do SPDA e dos aterramentos**;

**NR-10 · Módulo 07 – EPC: proteção para todos no local**
## Cuidados com os EPC
- Devem ser **adequados ao nível de tensão** e à atividade.
- Precisam de **inspeção antes do uso** e de ensaios periódicos, conforme o fabricante e as normas técnicas.
- Devem estar especificados na documentação da empresa e, quando aplicável, no Prontuário das Instalações Elétricas.
- Nunca improvise: um EPC danificado deve ser retirado de uso e identificado.

**NR-10 · Módulo 10 – O que precisa estar documentado**
Empresas que operam no SEP, ou em suas proximidades, têm exigências adicionais de documentação.

## Boas práticas
- O prontuário deve ficar à disposição dos trabalhadores envolvidos e da fiscalização.
- Deve ser organizado e mantido atualizado por responsável designado pela empresa.
- Sempre que a instalação for modificada, os diagramas precisam ser revisados antes que alguém trabalhe com base neles.

**NR-10 · Módulo 04 – Aterramento, equipotencialização e seccionamento automático**
## Aterramento
É a ligação intencional à terra. O **aterramento de proteção** conecta as massas (carcaças) para que, em caso de falha, a corrente tenha um caminho seguro e os dispositivos de proteção atuem. O **aterramento temporário** é instalado durante a manutenção para proteger o trabalhador contra energização acidental.

## Equipotencialização
É ligar eletricamente partes condutoras para que fiquem no **mesmo potencial**. Sem diferença de potencial entre as partes que o trabalhador pode tocar, não há circulação de corrente pelo corpo.

**NR-10 · Módulo 04 – Simulação: ordene a desenergização**
Resposta: seccionamento → impedimento de reenergização → constatação da ausência de tensão → aterramento temporário com equipotencialização → proteção dos elementos energizados → sinalização de impedimento de reenergização.
